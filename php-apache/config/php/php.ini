; php.ini mínimo — solo overrides reales
;
; Este archivo NO es una copia de php.ini-production/development. Se dejaron
; fuera a propósito todas las directivas que ya coinciden con el valor por
; defecto del contenedor (verificado comparando `php -i` con y sin este
; archivo montado) para no arrastrar ~1900 líneas de ruido en cada revisión.
; Si el contenedor no monta ningún php.ini, PHP usa sus defaults de fábrica;
; todo lo que aparece aquí abajo es, por definición, un cambio intencional
; sobre ese comportamiento base.

[PHP]

; Zona horaria (default de fábrica: UTC)
date.timezone = "America/Mexico_City"

; Límites de recursos — el contenedor tiene un tope de 768M (ver
; docker-compose.yml), memory_limit debe quedar por debajo con margen para
; varios workers de Apache concurrentes.
memory_limit = 256M
max_execution_time = 300
max_input_time = 60
max_input_vars = 5000
post_max_size = 2G
upload_max_filesize = 2G
output_buffering = 4096

; Seguridad de sesiones y del propio PHP
expose_php = Off
enable_dl = Off
short_open_tag = Off
session.use_strict_mode = 1
session.cookie_httponly = On
session.cookie_samesite = Lax
session.gc_divisor = 1000
session.sid_length = 26
session.sid_bits_per_character = 5

; Manejo de errores: no mostrar en el navegador, sí registrar en logs
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; Comportamiento del motor heredado de php.ini-production
variables_order = "GPCS"
request_order = "GP"
zend.assertions = -1
zend.exception_ignore_args = On
zend.exception_string_param_max_len = 0

[opcache]
; El resto de opcache.* (enable, max_accelerated_files, validate_timestamps,
; revalidate_freq, save_comments) ya coincide con el default del contenedor.
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 24
