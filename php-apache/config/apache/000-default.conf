<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    # Habilitar AllowOverride All para todos los proyectos.
    # -Indexes: sin listado de directorios. FollowSymLinks lo necesita mod_rewrite.
    <Directory /var/www/html>
        Options -Indexes -MultiViews +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Logs
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    # Prevenir acceso a archivos ocultos
    <DirectoryMatch "^\.|\/\.">
        Require all denied
    </DirectoryMatch>

    # Deshabilitar listado de directorios en archivos sensibles
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    # Directorios privados de cualquier proyecto (htdocs/<proyecto>/<dir>): nunca se sirven.
    # Se evalua despues del .htaccess del proyecto, asi que este no puede reabrirlos.
    # No incluye vendor/ (docker-apps sirve JS desde ahi), uploads/ ni downloads/ (publicos a proposito).
    <DirectoryMatch "^/var/www/html/[^/]+/(src|app|cli|data|cache|logs|config|database|imports|includes|sql|templates|migrations|tests)(/|$)">
        Require all denied
    </DirectoryMatch>

    # Ficheros que nunca son contenido web (dumps, configuracion, docs, logs).
    # No se bloquea .txt ni .js/.css. Los .php de esos tipos no aplican: se ejecutan, no se leen.
    <FilesMatch "\.(sql|db|sqlite|sqlite3|json|md|log|ini|bak|env|lock|tsv|csv|yml|yaml|sh|py|example)$">
        Require all denied
    </FilesMatch>
</VirtualHost>
