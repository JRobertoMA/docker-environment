<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    # Habilitar AllowOverride All para todos los proyectos
    <Directory /var/www/html>
        Options Indexes FollowSymLinks MultiViews
        AllowOverride All
        Require all granted
    </Directory>

    # Logs
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    # Prevenir acceso a archivos ocultos
    <DirectoryMatch "^\.|\/\.">
        Require all denied
    </DirectoryMatch>

    # Deshabilitar listado de directorios en archivos sensibles
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
</VirtualHost>
