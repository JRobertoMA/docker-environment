services:
  srvbox:
    image: ghcr.io/lollipopkit/server-box-monitor:latest
    networks:
      - monitor_net
    container_name: srvbox
    restart: unless-stopped
    ports:
      - 3770:3770
    environment:
      - TZ=America/Mexico_City
      - SBM_HOST=0.0.0.0
      - SBM_PORT=3770
      - DATABASE_URL=sqlite:/app/data/serverbox_monitor.db
      - RUST_LOG=info
      # full_access viene ENCENDIDO por defecto en Linux si config.toml no lo
      # declara — y config.toml vive dentro del contenedor (se regenera con
      # valores por defecto en cada recreación), así que la garantía tiene que
      # estar aquí. El entorno puede desactivarlo pero nunca reabrirlo
      # silenciosamente (core/remote_access.rs::resolve_full_access).
      - SBM_FULL_ACCESS=0
    # Auto-siembra: /app/config.toml NO se monta como archivo a propósito (el
    # agente lo reescribe con rename atómico al guardar ajustes desde la app, y
    # un bind-mount de archivo rompe ese rename con EBUSY). En su lugar se monta
    # ./config como directorio y, si el contenedor es nuevo (no hay config.toml
    # en su capa de escritura), se copia la copia maestra antes de arrancar.
    # En reinicios normales el archivo ya existe y no se toca, así que los
    # ajustes guardados desde la app se conservan. Para aplicar cambios hechos
    # en ./config/config.toml: `docker compose up -d --force-recreate`.
    command: sh -c '[ -f config.toml ] || cp config/config.toml config.toml; exec ./server_box_monitor'
    volumes:
      # Copia maestra de config.toml (reglas, push de Telegram). El binario no
      # lee de aquí; solo la usa el comando de arriba en el primer arranque.
      - ./config:/app/config:ro
      - ./data:/app/data
      - /etc/hostname:/etc/host_hostname:ro
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3770/api/v1/health" ]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

    # Uso real en reposo ~9MB (agente en Rust). El límite es holgado a
    # propósito: contiene un desborde al propio contenedor en vez de dejar que
    # tumbe el host (ver README, riesgos). No hace falta recrear para
    # ajustarlo si algún día se baja.
    deploy:
      resources:
        limits:
          memory: 512M
networks:
  monitor_net:
    external: true
