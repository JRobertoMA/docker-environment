name: immich

services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    volumes:
      # Fotos, thumbs, vídeos transcodificados y backups diarios de la BD
      # (library/backups). Ruta heredada de Immich 1.x; desde 2.x el compose
      # oficial monta en /data, pero el server sigue soportando esta.
      - ${UPLOAD_LOCATION}:/usr/src/app/upload
      # Solo afecta a `date`; Node ignora /etc/localtime, la zona horaria
      # real de Immich (hora de backups, logs) la fija TZ en .env.
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    ports:
      - '2283:2283'
    depends_on:
      - redis
      - database
    restart: always
    networks:
      - media_net
    healthcheck:
      disable: false
    # Límite de memoria: uso real ~700MB, pico al procesar lotes de fotos.
    # Sin límite, un desborde de cualquier contenedor tumba el host entero
    # (visto varias veces); con límite, cgroups mata solo a este contenedor.
    deploy:
      resources:
        limits:
          memory: 1536M

  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    volumes:
      - model-cache:/cache
    env_file:
      - .env
    restart: always
    networks:
      - media_net
    healthcheck:
      disable: false
    # Uso real ~270MB en reposo; carga modelos de ML (caras, búsqueda
    # semántica) en RAM cuando trabaja, de ahí el margen.
    deploy:
      resources:
        limits:
          memory: 1536M

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:8-bookworm@sha256:fec42f399876eb6faf9e008570597741c87ff7662a54185593e74b09ce83d177
    healthcheck:
      test: redis-cli ping || exit 1
    restart: always
    networks:
      - media_net

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    restart: always
    networks:
      - media_net

volumes:
  model-cache:

networks:
  media_net:
    external: true